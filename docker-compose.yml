version: '3.8'

services:
  # Security scanning tools
  gitleaks:
    image: zricethezav/gitleaks:v8.30.1
    container_name: gitleaks-scanner
    volumes:
      - .:/src
    working_dir: /src
    command: ["--help"]

  hadolint:
    image: hadolint/hadolint:v2.14.0-alpine
    container_name: hadolint-linter
    volumes:
      - .:/workdir
    working_dir: /workdir
    command: ["--help"]

  shellcheck:
    image: koalaman/shellcheck:v0.11.0
    container_name: shellcheck-linter
    volumes:
      - .:/src
    working_dir: /src
    command: ["--version"]

  yamllint:
    image: volkerraschek/yamllint:1.38.0
    container_name: yamllint-linter
    volumes:
      - .:/workdir
    working_dir: /workdir
    command: ["--version"]

  trivy:
    image: aquasec/trivy:0.72.0
    container_name: trivy-scanner
    volumes:
      - .:/src
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /src
    command: ["--help"]

  checkov:
    image: bridgecrew/checkov:3.3.7
    container_name: checkov-scanner
    volumes:
      - .:/tf
    working_dir: /tf
    command: ["--help"]

  # Kubernetes tools
  kubescore:
    image: zegl/kube-score:v1.20.0
    container_name: kubescore-scanner
    volumes:
      - .:/project
    working_dir: /project
    command: ["score", "--help"]

  # Network configuration
networks:
  default:
    name: devsecops-tools
